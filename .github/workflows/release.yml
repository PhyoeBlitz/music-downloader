name: Build and release

# Push a tag like v1.0.0 to build the Windows exes and publish a GitHub release.
# "Run workflow" (manual) builds the exes as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Work out version
        run: |
          # v1.2.3 tag -> 1.2.3; manual runs without a tag get 0.0.0
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "Version: $v"

      - name: Build exes
        run: |
          python packaging/make_version_info.py $env:VERSION MusicDownloader    "Music Downloader (command line)" build/cli_version.txt
          python packaging/make_version_info.py $env:VERSION MusicDownloaderGUI "Music Downloader"                build/gui_version.txt
          pyinstaller --noconfirm --onefile --console  --name MusicDownloader    --version-file build/cli_version.txt --collect-all yt_dlp_ejs download_music.py
          pyinstaller --noconfirm --onefile --windowed --name MusicDownloaderGUI --version-file build/gui_version.txt --collect-all yt_dlp_ejs gui.py

      - name: Smoke test
        run: |
          ./dist/MusicDownloader.exe -h | Select-Object -First 3
          foreach ($exe in "dist/MusicDownloader.exe", "dist/MusicDownloaderGUI.exe") {
            $vi = (Get-Item $exe).VersionInfo
            "{0}: {1} {2} - {3}" -f $exe, $vi.ProductName, $vi.ProductVersion, $vi.LegalCopyright
            if ($vi.ProductVersion -ne $env:VERSION) { throw "Version metadata missing in $exe" }
          }

      - name: Package zip
        run: |
          $pkg = "package/MusicDownloader"
          New-Item -ItemType Directory $pkg -Force | Out-Null
          Copy-Item dist/MusicDownloader.exe, dist/MusicDownloaderGUI.exe, packaging/README.txt $pkg
          Get-Content examples/metal_playlist.csv -TotalCount 4 -Encoding utf8 | Set-Content "$pkg/sample.csv" -Encoding utf8
          Compress-Archive -Path "$pkg/*" -DestinationPath MusicDownloader-windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: MusicDownloader-windows
          path: MusicDownloader-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            "Windows download: **MusicDownloader-windows.zip** (app + command line). Requires FFmpeg - see README.txt inside the zip."
            ""
            "The exes are not code-signed. To avoid the 'Windows protected your PC' warning, right-click the zip, choose Properties, tick **Unblock**, click OK, then extract it. Or run: ``Unblock-File .\MusicDownloader-windows.zip``"
          ) -join "`n"
          gh release create "${{ github.ref_name }}" MusicDownloader-windows.zip --title "${{ github.ref_name }}" --notes $notes

  # Sends the new version to winget (microsoft/winget-pkgs) as a pull request.
  # Turns on once the WINGET_TOKEN secret exists; see packaging/winget/README.md.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Submit to winget
        if: env.HAS_WINGET_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PhyoeBlitz.MusicDownloader
          installers-regex: 'MusicDownloader-windows\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
