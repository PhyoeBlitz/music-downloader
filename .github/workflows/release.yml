name: Build and release

# Push a tag like v1.0.0 to build the Windows exes and publish a GitHub release.
# "Run workflow" (manual) builds the exes as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the SignPath secret is added
      # (see SIGNING.md). Until then the exes are published unsigned.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Work out version
        run: |
          # v1.2.3 tag -> 1.2.3; manual runs without a tag get 0.0.0
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "Version: $v"

      - name: Build exes
        run: |
          python packaging/make_version_info.py $env:VERSION MusicDownloader    "Music Downloader (command line)" build/cli_version.txt
          python packaging/make_version_info.py $env:VERSION MusicDownloaderGUI "Music Downloader"                build/gui_version.txt
          pyinstaller --noconfirm --onefile --console  --name MusicDownloader    --version-file build/cli_version.txt --collect-all yt_dlp_ejs download_music.py
          pyinstaller --noconfirm --onefile --windowed --name MusicDownloaderGUI --version-file build/gui_version.txt --collect-all yt_dlp_ejs gui.py

      - name: Smoke test
        run: |
          ./dist/MusicDownloader.exe -h | Select-Object -First 3
          foreach ($exe in "dist/MusicDownloader.exe", "dist/MusicDownloaderGUI.exe") {
            $vi = (Get-Item $exe).VersionInfo
            "{0}: {1} {2} - {3}" -f $exe, $vi.ProductName, $vi.ProductVersion, $vi.LegalCopyright
            if ($vi.ProductVersion -ne $env:VERSION) { throw "Version metadata missing in $exe" }
          }

      - name: Upload unsigned exes
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exes
          path: |
            dist/MusicDownloader.exe
            dist/MusicDownloaderGUI.exe

      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          # SignPath Foundation requests wait for manual approval: allow up to 1 hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed exes
        if: env.HAS_SIGNPATH == 'true'
        run: Copy-Item signed/*.exe dist/ -Force

      - name: Package zip
        run: |
          $pkg = "package/MusicDownloader"
          New-Item -ItemType Directory $pkg -Force | Out-Null
          Copy-Item dist/MusicDownloader.exe, dist/MusicDownloaderGUI.exe, packaging/README.txt $pkg
          Get-Content examples/metal_playlist.csv -TotalCount 4 -Encoding utf8 | Set-Content "$pkg/sample.csv" -Encoding utf8
          Compress-Archive -Path "$pkg/*" -DestinationPath MusicDownloader-windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: MusicDownloader-windows
          path: MusicDownloader-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signed = if ($env:HAS_SIGNPATH -eq 'true') { "Signed via SignPath." } else { "Not code-signed yet: Windows may show 'Windows protected your PC' - click More info, then Run anyway." }
          $notes = "Windows download: **MusicDownloader-windows.zip** (GUI + command line). Requires FFmpeg - see README.txt inside the zip.`n`n$signed"
          gh release create "${{ github.ref_name }}" MusicDownloader-windows.zip --title "${{ github.ref_name }}" --notes $notes
